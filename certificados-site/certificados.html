<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Declarações</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
        }

        .certificate-page {
            width: 100%;
            max-width: 1122px; /* A4 width in pixels approx */
            aspect-ratio: 1.414; /* A4 Landscape ratio (297/210) */
            background-color: white;
            position: relative;
            margin: 2rem auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: #000;
            
            /* Forces background colors/SVG to print */
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        @media print {
            @page {
                size: A4 landscape;
                margin: 0; 
            }

            body {
                background-color: white;
            }

            .no-print {
                display: none !important;
            }

            .certificate-page {
                width: 297mm;
                height: 209mm; /* 209mm prevents extra blank pages in some browsers */
                max-width: none;
                margin: 0;
                box-shadow: none;
                page-break-after: always;
                page-break-inside: avoid;
            }

            .certificate-page:last-child {
                page-break-after: auto;
            }
            
            #certificates-container {
                padding: 0;
                margin: 0;
            }
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <div class="no-print max-w-5xl mx-auto pt-8 px-4">
        <div class="bg-white rounded-xl shadow-lg p-6 border border-gray-200 mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Emissor de Declarações</h1>
            
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <!-- Textarea for names -->
                <div>
                    <label for="names" class="block text-sm font-semibold text-gray-700 mb-2">Nomes dos Participantes (Um por linha)</label>
                    <textarea id="names" rows="8" 
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" 
                        placeholder="Daniel Henrique da Silva Guimarães&#10;Maria de Souza Pereira..."
                    ></textarea>
                </div>

                <div class="flex flex-col gap-6">
                    <div>
                        <label for="customText" class="block text-sm font-semibold text-gray-700 mb-2">Texto da Declaração (após o nome)</label>
                        <textarea id="customText" rows="5" 
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                        > participou efetivamente da organização do evento "7º CAFÉ COM CIÊNCIA : Atendimento Odontológico à Gestante - Barreiras e Facilitadores", promovido pelas professoras Patricia Drummond e Camila Mundim, no Centro Universitário Arnaldo Janssen, com carga horária de 6 horas.</textarea>
                    </div>

                    <div>
                        <label for="emissionDate" class="block text-sm font-semibold text-gray-700 mb-2">Data de Emissão</label>
                        <input type="date" id="emissionDate" 
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors">
                    </div>
                </div>
            </div>

            <div id="errorMessage" class="hidden mb-4 text-red-600 text-sm font-semibold bg-red-50 p-3 rounded-md border border-red-200">
                <!-- Error messages will appear here -->
            </div>

            <div class="flex flex-col sm:flex-row gap-4 border-t border-gray-100 pt-6">
                <button onclick="generateCertificates()" class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow transition-colors flex items-center justify-center gap-2">
                    Gerar Declarações
                </button>
                
                <button id="printBtn" onclick="window.print()" class="hidden px-8 py-3 bg-gray-800 hover:bg-gray-900 text-white font-semibold rounded-lg shadow transition-colors items-center justify-center gap-2">
                    Imprimir Declarações
                </button>
            </div>
        </div>
    </div>

    <div id="certificates-container" class="w-full px-4 flex flex-col items-center">
        <!-- Javascript will inject the certificates here -->
    </div>

    <script>
        function formatDateToPortuguese(dateString) {
            if (!dateString) return "____ de ______________ de 20__";
            
            const [year, month, day] = dateString.split('-');
            const months = [
                "janeiro", "fevereiro", "março", "abril", "maio", "junho", 
                "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"
            ];
            
            return `${day} de ${months[parseInt(month) - 1]} de ${year}`;
        }

        function generateCertificates() {
            const namesTextarea = document.getElementById('names').value;
            let customText = document.getElementById('customText').value;
            const dateInput = document.getElementById('emissionDate').value;
            const container = document.getElementById('certificates-container');
            const printBtn = document.getElementById('printBtn');
            const errorMsg = document.getElementById('errorMessage');
            
            // Hide previous errors
            errorMsg.classList.add('hidden');
            errorMsg.innerText = '';

            const names = namesTextarea.split('\n')
                                     .map(n => n.trim())
                                     .filter(n => n.length > 0);
            
            if (names.length === 0) {
                errorMsg.innerText = "Por favor, insira pelo menos um nome na lista antes de gerar as declarações.";
                errorMsg.classList.remove('hidden');
                return;
            }

            // Ensure custom text starts with a space if it doesn't already, or comma
            if (customText.length > 0 && !customText.startsWith(',') && !customText.startsWith(' ')) {
                customText = ' ' + customText;
            }

            const formattedDate = formatDateToPortuguese(dateInput);
            container.innerHTML = '';

            names.forEach((name) => {
                const certDiv = document.createElement('div');
                certDiv.className = 'certificate-page flex flex-col justify-between';
                
                // Constructing the specific declaration layout
                certDiv.innerHTML = `
                    <!-- Blue Geometric Shape - Top Left -->
                    <svg class="absolute top-0 left-0 w-[400px] sm:w-[450px] h-auto" viewBox="0 0 450 180" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <polygon points="0,0 450,0 180,150 0,60" fill="#009ce4" />
                    </svg>

                    <!-- Top Right Logo with Fallback -->
                    <img src="logo.png" alt="Logo" class="absolute top-8 right-12 h-20 sm:h-24 object-contain" 
                         onerror="this.onerror=null; this.outerHTML='<div class=\\'absolute top-8 right-12 h-24 w-32 bg-gray-200 border-2 border-dashed border-gray-400 flex items-center justify-center text-xs text-gray-500 rounded text-center\\'>[Logo da<br>Faculdade]</div>'">

                    <div class="pt-40 sm:pt-48 px-16 sm:px-24 flex-1 flex flex-col items-center">
                        <h1 class="text-4xl sm:text-5xl font-bold text-black mb-14 tracking-wide uppercase">Declaração</h1>

                        <p class="text-lg sm:text-xl text-center text-black leading-relaxed max-w-4xl font-normal">
                            Declaramos que <b class="italic font-bold">${name}</b>${customText}
                        </p>

                        <p class="text-base sm:text-lg text-center text-black mt-16 font-normal">
                            Belo Horizonte, ${formattedDate}.
                        </p>
                    </div>

                    <div class="pb-16 w-full flex flex-col items-center z-10">
                        <!-- Signature Image with Fallback -->
                        <img src="assinatura.png" alt="Assinatura" class="h-16 sm:h-20 object-contain mb-2" 
                             onerror="this.onerror=null; this.outerHTML='<div class=\\'h-16 sm:h-20 w-48 bg-gray-200 border-2 border-dashed border-gray-400 flex items-center justify-center text-xs text-gray-500 rounded text-center mb-2\\'>[Assinatura]</div>'">
                        
                        <div class="border-t border-black w-2/5 sm:w-[450px] mb-2"></div>
                        <p class="text-center text-black text-base sm:text-lg font-normal">Gerdal Roberto de Sousa</p>
                        <p class="text-center text-black text-base sm:text-lg font-normal">Coordenador do Curso de Odontologia</p>
                    </div>
                `;
                
                container.appendChild(certDiv);
            });

            printBtn.classList.remove('hidden');
            printBtn.classList.add('flex');
            
            container.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    </script>
</body>
</html>
