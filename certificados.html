<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificado Oficial - 10° Café com Ciência</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f4f6;
      margin: 0;
      padding: 0;
    }

    .certificate-page {
      width: 100%;
      max-width: 1122px; /* A4 width in pixels */
      aspect-ratio: 1.414; /* A4 Landscape ratio (297/210) */
      background-color: white;
      position: relative;
      margin: 2rem auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      color: #000;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    @media print {
      @page {
        size: A4 landscape;
        margin: 0; 
      }

      body {
        background-color: white;
      }

      .no-print {
        display: none !important;
      }

      .certificate-page {
        width: 297mm;
        height: 209mm;
        max-width: none;
        margin: 0;
        box-shadow: none;
        page-break-after: always;
        page-break-inside: avoid;
      }

      .certificate-page:last-child {
        page-break-after: auto;
      }
      
      #certificates-container {
        padding: 0;
        margin: 0;
      }
    }

<body class="min-h-screen pb-12">

  <!-- BARRA DE CONTROLE SUPERIOR (NÃO APARECE NA IMPRESSÃO) -->
  <header class="no-print bg-stone-900 text-white py-4 px-6 shadow-md sticky top-0 z-50">

      <div class="flex items-center gap-3">

          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <div>
          <h1 class="text-base font-bold">Certificado Oficial de Participação</h1>
          <p class="text-xs text-stone-400">10° Café com Ciência: Os Direitos dos Pacientes na Odontologia</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button id="btnPrintCertificado" onclick="window.print()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow transition flex items-center gap-2">
          <i data-lucide="printer" class="w-4 h-4"></i>
          <span>Imprimir / Salvar PDF</span>
        </button>
      </div>
    </div>
  </header>

  <!-- CONTAINER DO CERTIFICADO -->
  <main id="certificates-container" class="w-full px-4 flex flex-col items-center">
    
    <div id="loadingCertificado" class="py-20 text-center text-stone-500">
      <i data-lucide="loader-2" class="w-8 h-8 animate-spin text-blue-600 mx-auto mb-3"></i>
      <p class="font-medium">Carregando e autenticando declaração...</p>
    </div>

    <!-- O template será injetado aqui -->
    <div id="certificateTarget" class="w-full flex justify-center"></div>

  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (window.lucide) window.lucide.createIcons();
      await carregarCertificado();
    });

    function formatarDataPorExtenso(dataStr) {
      const meses = [
        "janeiro", "fevereiro", "março", "abril", "maio", "junho", 
        "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"
      ];
      const data = dataStr ? new Date(dataStr) : new Date(2026, 9, 30);
      const dia = String(data.getDate()).padStart(2, '0');
      const mes = meses[data.getMonth()];
      const ano = data.getFullYear();
      return `${dia} de ${mes} de ${ano}`;
    }

    async function carregarCertificado() {
      const params = new URLSearchParams(window.location.search);
      const protocolo = params.get('protocolo');
      const nomeParam = params.get('nome');
      const loading = document.getElementById('loadingCertificado');
      const target = document.getElementById('certificateTarget');

      let aluno = null;

      if (protocolo) {
        try {
          aluno = await window.LigaDB.buscarInscricao(protocolo);
        } catch (e) {
          console.warn('Erro ao buscar inscrição:', e);
        }
      }

            const proto = (aluno?.protocolo || '').toUpperCase();
      const edNum = aluno?.edicao ? parseInt(aluno.edicao, 10) : (params.get('edicao') ? parseInt(params.get('edicao'), 10) : 0);
      const is12 = proto.startsWith('CC12-') || edNum === 12;
      const is11 = proto.startsWith('CC11-') || edNum === 11;

      let nomeEvento = '10° Café com Ciência';
      let temaPalestra = '"10º CAFÉ COM CIÊNCIA : Os Direitos dos Pacientes na Odontologia"';
      let palestranteNome = 'Profa. Carolina Diniz';
      let dataDefault = '2026-10-30';
      let prefixoCert = 'CC10';
      let horasParticipacao = 2; // 2 Horas conforme declaração oficial enviada
      let nomeCoordenador = 'Jhonathan Lopes Silva'; // Coordenador Oficial do 10° Café
      let cargoCoordenador = 'Coordenador do Curso de Odontologia';

      if (is12) {
        nomeEvento = '12° Café com Ciência';
        temaPalestra = '"12º CAFÉ COM CIÊNCIA : Diagnóstico e Planejamento na Reabilitação Oral"';
        palestranteNome = 'Dra. Thaissa Calab';
        dataDefault = '2026-11-18';
        prefixoCert = 'CC12';
        horasParticipacao = 4;
        nomeCoordenador = 'Jhonathan Lopes Silva';
        cargoCoordenador = 'Coordenador do Curso de Odontologia';
      } else if (is11) {
        nomeEvento = '11° Café com Ciência';
        temaPalestra = '"11º CAFÉ COM CIÊNCIA : 10 anos do projeto NAM em Belo Horizonte"';
        palestranteNome = 'Prof. Dr. Henrique Pretti';
        dataDefault = '2026-11-13';
        prefixoCert = 'CC11';
        horasParticipacao = 4;
        nomeCoordenador = 'Jhonathan Lopes Silva';
        cargoCoordenador = 'Coordenador do Curso de Odontologia';
      }

      document.title = `Certificado Oficial - ${nomeEvento}`;
      const subtitleEl = document.querySelector('header p.text-stone-400');
      if (subtitleEl) subtitleEl.textContent = `${nomeEvento} · UniArnaldo`;

      const nomeFinal = aluno ? aluno.nome_completo : (nomeParam || 'Participante Oficial');
      const codigoAutenticidade = aluno ? (aluno.certificado_codigo || `CERT-${aluno.protocolo}`) : `CERT-${prefixoCert}-${Math.floor(100000 + Math.random() * 900000)}`;
      const dataFormatada = formatarDataPorExtenso(aluno?.presenca_horario || dataDefault);

      // Verifica se a comissão da Liga liberou os certificados ou se o aluno já teve certificado emitido
      const isLiberadoConfig = window.LigaDB?.estaoCertificadosLiberados ? window.LigaDB.estaoCertificadosLiberados() : true;
      const jaEmitido = aluno?.certificado_emitido === true || aluno?.presenca_confirmada === true;
      const isAdminPreview = params.get('admin') === 'true' || (window.LigaDB?.isOrganizadorLogado && window.LigaDB.isOrganizadorLogado());
      const isLiberado = isLiberadoConfig || jaEmitido || isAdminPreview;

      if (!isLiberado) {
        loading.classList.add('hidden');
        const btnPrint = document.getElementById('btnPrintCertificado');
        if (btnPrint) btnPrint.classList.add('hidden');

        target.innerHTML = `
          <div class="max-w-lg w-full mx-auto my-12 bg-white rounded-3xl p-8 border border-stone-200 shadow-xl text-center">
            <div class="w-16 h-16 bg-amber-100 text-amber-700 rounded-2xl flex items-center justify-center mx-auto mb-4">
              <i data-lucide="clock" class="w-8 h-8"></i>
            </div>
            <h2 class="text-xl font-bold text-stone-900 mb-2">Certificados em Processo de Emissão</h2>
            <p class="text-sm text-stone-600 leading-relaxed mb-6">
              Os certificados oficiais do <strong>${nomeEvento}</strong> estão em fase de coleta e autenticação de assinaturas pela coordenação acadêmica do UniArnaldo. Assim que a comissão organizadora liberar a emissão no sistema, o download da sua declaração oficial de 4 horas estará disponível nesta página.
            </p>
            <div class="p-4 bg-stone-50 rounded-2xl text-xs text-stone-600 mb-6 text-left space-y-1.5 border border-stone-200">
              <p><strong>Participante:</strong> ${nomeFinal}</p>
              ${aluno?.protocolo ? `<p><strong>Protocolo:</strong> ${aluno.protocolo}</p>` : ''}
              <p><strong>Status de Presença:</strong> ${aluno?.presenca_confirmada ? '✅ Presença Confirmada no Evento' : '⏳ Aguardando confirmação no dia da palestra'}</p>
            </div>
            <a href="${is12 ? '12cafe.html' : (is11 ? '11cafe.html' : 'index.html')}" class="inline-flex items-center justify-center gap-2 w-full py-3.5 px-5 bg-stone-900 hover:bg-black text-white font-bold text-xs rounded-xl shadow transition">
              <i data-lucide="arrow-left" class="w-4 h-4"></i>
              <span>Voltar para a Página do Evento</span>
            </a>
          </div>
        `;
        if (window.lucide) window.lucide.createIcons();
        return;
      }

      loading.classList.add('hidden');

      // Suporte a tipos de certificado: participacao, organizador ou ambos (membros da liga)
      const tipoParam = params.get('tipo') || (aluno?.role === 'organizador' ? 'ambos' : 'participacao');
      const codigoOrg = aluno ? `CERT-ORG-${aluno.protocolo}` : `CERT-ORG-${prefixoCert}-${Math.floor(100000 + Math.random() * 900000)}`;

      function gerarHtmlCertificadoUnico(tipo, cod) {
        const isOrg = tipo === 'organizador';
        const textoCorpo = isOrg
          ? `Declaramos que <b class="italic font-bold">${nomeFinal}</b> participou efetivamente da comissão organizadora do evento <strong>${temaPalestra}</strong>, promovido pelas professoras Patricia Drummond e Camila Mundim e pela Liga Acadêmica Café com Ciência, no Centro Universitário Arnaldo Janssen, com carga horária de 6 horas.`
          : `Declaramos que <b class="italic font-bold">${nomeFinal}</b> participou efetivamente da palestra <strong>${temaPalestra}</strong>, ministrada pela ${palestranteNome} e promovida pela Liga Acadêmica Café com Ciência, realizada no Centro Universitário Arnaldo Janssen, com carga horária de ${horasParticipacao} horas.`;

        return `

              </button>

              ${gerarHtmlCertificadoUnico('organizador', codigoOrg)}
            </div>
          </div>
        `;

        window.mostrarCertificadoPublico = function(modo) {
          const cPart = document.getElementById('containerCertPart');
          const cOrg = document.getElementById('containerCertOrg');
          const bPart = document.getElementById('btnTabPart');
          const bOrg = document.getElementById('btnTabOrg');

          if (modo === 'todos') {
            if (cPart) cPart.classList.remove('hidden');
            if (cOrg) cOrg.classList.remove('hidden');
            window.print();
            return;
          }

          if (modo === 'organizador') {
            if (cPart) cPart.classList.add('hidden');
            if (cOrg) cOrg.classList.remove('hidden');
            if (bOrg) {
              bOrg.className = 'px-4 py-2 rounded-xl text-xs font-bold transition bg-purple-600 text-white shadow';
            }
            if (bPart) {
              bPart.className = 'px-4 py-2 rounded-xl text-xs font-bold transition text-stone-300 hover:text-white';
            }

            if (cPart) cPart.classList.remove('hidden');
            if (cOrg) cOrg.classList.add('hidden');
            if (bPart) {

          }
